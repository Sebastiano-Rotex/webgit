<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWII — Welcome</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    #vanta-bg {
      width: 100%;
      height: 100vh;
    }

    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(220, 210, 200, 0.75);
      text-align: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      pointer-events: none;
    }

    .content h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: .06em;
      margin: 0 0 10px;
      text-shadow: 0 2px 12px rgba(0,0,0,.6);
    }

    .content p {
      font-size: 1rem;
      opacity: .8;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>

  <div class="content">
    <h1 data-i18n="welcome.title">Bun venit</h1>
    <p data-i18n="welcome.subtitle">Un proiect educațional dedicat celui de-Al Doilea Război Mondial</p>
  </div>

  <script src="lang.js"></script>

  <script>
    VANTA.DOTS({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0x3fff99,
      color2: 0xffffff,
      backgroundColor: 0x0a0a0a,
    });
  </script>
</body>
</html>
